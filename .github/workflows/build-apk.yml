name: Build Food Warehouse APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate and Save Permanent Keystore (Only Once)
        run: |
          if [ ! -f "app/warehouse-key.jks" ]; then
            keytool -genkey -v -keystore app/warehouse-key.jks \
              -storepass LuxuryPassword123 -keypass LuxuryPassword123 \
              -alias warehouse_alias -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=FoodWarehouse, OU=Dev, O=Luxury, L=Tehran, S=Tehran, C=IR"
            
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add app/warehouse-key.jks
            git commit -m "Add permanent signing keystore"
            git push
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          fi
          chmod +x ./gradlew

      - name: Build Signed APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: food-warehouse-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub Release on Tag Push
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
